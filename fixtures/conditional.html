<!doctype html><meta charset=utf-8><title>Support request</title><style>body{font:15px system-ui;max-width:520px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}[hidden]{display:none}</style>
<h1>Support request</h1>
<form id="f" novalidate>
  <label for="kind">Request type</label>
  <select id="kind" name="kind"><option value="">Choose</option><option value="bug">Bug report</option><option value="billing">Billing</option><option value="other">Other</option></select>
  <div id="bug" hidden>
    <label for="steps">Steps to reproduce *</label><textarea id="steps" name="steps"></textarea>
    <label for="sev">Severity *</label><select id="sev" name="severity"><option value="">Choose</option><option value="low">Low</option><option value="high">High</option></select>
  </div>
  <div id="billing" hidden>
    <label for="inv">Invoice number *</label><input id="inv" name="invoice" pattern="INV-[0-9]{4}">
    <div class="error" id="inverr" role="alert"></div>
  </div>
  <label><input type="checkbox" id="more" name="more" style="width:auto"> I want to add contact details</label>
  <div id="contact" hidden><label for="em">Email *</label><input id="em" name="email" type="email"></div>
  <button type="submit">Send</button>
  <div class="error" id="err" role="alert"></div>
</form>
<script>
const $=id=>document.getElementById(id);
$('kind').addEventListener('change',()=>{$('bug').hidden=$('kind').value!=='bug';$('billing').hidden=$('kind').value!=='billing'});
$('more').addEventListener('change',()=>{$('contact').hidden=!$('more').checked});
$('f').addEventListener('submit',async e=>{e.preventDefault();
 const o={};for(const [k,v] of new FormData(e.target).entries()){ if(!e.target.elements[k].closest('[hidden]')) o[k]=v }
 const miss=[];
 if(!o.kind)miss.push('Request type is required');
 if(o.kind==='bug'){if(!o.steps)miss.push('Steps are required');if(!o.severity)miss.push('Severity is required')}
 if(o.kind==='billing'&&!/^INV-[0-9]{4}$/.test(o.invoice||''))miss.push('Invoice must look like INV-1234');
 if(o.more&&!o.email)miss.push('Email is required');
 $('err').textContent=miss.join('; ');if(miss.length)return;
 await fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});
 document.body.innerHTML='<h1>Sent</h1>'});
</script>
