name: Pages
on:
  push: { branches: [main], paths: ["site/**", "assets/**", "docs/**", "README.md", "SECURITY.md", "CHANGELOG.md", "Cargo.toml", ".github/workflows/pages.yml"] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Public by design: it only proves we control site/<key>.txt (https://www.indexnow.org/documentation).
    env: { INDEXNOW_KEY: f9643ca7df882e863c9e7240e9d18661 }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # the IndexNow step diffs against the previous commit
      # Build from the docs so the uploaded site always matches the repository, then refuse to deploy a
      # site with broken links, invalid or contradictory structured data, or non-absolute LLM links.
      - name: Build and check the site
        run: |
          python3 site/tools/build_docs.py
          python3 site/tools/check_links.py
          python3 site/tools/check_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v5
      - name: Smoke test the live site
        run: |
          base="${{ steps.d.outputs.page_url }}"
          for f in "" favicon.svg assets/og.png assets/icon-180.png sitemap.xml llms.txt llms-full.txt docs/research-with-citations.html docs/ostler-vs-playwright-mcp.html "$INDEXNOW_KEY.txt"; do
            curl -fsS --retry 5 --retry-delay 3 -o /dev/null -w "%{http_code} $base$f\n" "$base$f"
          done
      # Tell the IndexNow engines (Bing, Yandex, Seznam, Naver; Bing's index also backs Copilot) which
      # pages changed. This is a notification, not proof of indexing. Runs after the smoke test above, so
      # only live URLs are announced. A failure here must not fail the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env: { BEFORE_SHA: "${{ github.event.before }}" }
        run: |
          base="${{ steps.d.outputs.page_url }}"
          urls=$(python3 site/tools/indexnow_urls.py "$BEFORE_SHA")
          echo "IndexNow URLs: $urls"
          if [ "$urls" = "[]" ]; then echo "No page changed; nothing to announce."; exit 0; fi
          host=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).hostname)' "$base")
          body=$(python3 -c 'import json,sys; print(json.dumps({"host": sys.argv[1], "key": sys.argv[2], "keyLocation": sys.argv[3], "urlList": json.loads(sys.argv[4])}))' "$host" "$INDEXNOW_KEY" "${base}${INDEXNOW_KEY}.txt" "$urls")
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$body"
