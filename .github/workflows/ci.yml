name: CI
on:
  push: { branches: [main] }
  pull_request:
env:
  CARGO_TERM_COLOR: always
  WAYMARKER_REQUIRE_CHROME: "1"
  WAYMARKER_REQUIRE_QDRANT: "1"
  WAYMARKER_NO_SANDBOX: "1"   # GitHub runners do not allow Chrome's sandbox
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Download Qdrant
        run: |
          mkdir -p "$RUNNER_TEMP/qdrant" && cd "$RUNNER_TEMP/qdrant"
          curl -sSfL -o q.tgz https://github.com/qdrant/qdrant/releases/latest/download/qdrant-x86_64-unknown-linux-gnu.tar.gz
          tar xzf q.tgz
          echo "WAYMARKER_QDRANT_BIN=$RUNNER_TEMP/qdrant/qdrant" >> "$GITHUB_ENV"
          echo "WAYMARKER_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
