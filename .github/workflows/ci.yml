name: CI
# Action versions are pinned by tag (e.g. @v4). Pinning each action by full commit SHA is stricter
# (tags can be moved); do that if you need supply-chain hardening, and let Dependabot bump the SHAs.
# No `pull_request_target` anywhere: fork PRs run with a read-only token and no secrets.
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned Qdrant release. Checksum is the sha256 of qdrant-x86_64-unknown-linux-gnu.tar.gz, taken from the
  # GitHub release's published asset digest and confirmed by downloading the asset and hashing it locally.
  # To bump: change both values together (see https://github.com/qdrant/qdrant/releases).
  QDRANT_VERSION: v1.20.0
  QDRANT_SHA256: 2361f3df0dedfef31f5444f9f15bd15d6b4a6cba6ad952daecc5fbe3867c5ee6
jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2   # caches ~/.cargo registry and target/, keyed on Cargo.lock + toolchain
        with: { shared-key: lint }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OSTLER_REQUIRE_CHROME: "1"
      OSTLER_REQUIRE_QDRANT: "1"   # the Qdrant-backed suites (incl. sealing) fail instead of skipping
      OSTLER_NO_SANDBOX: "1"       # GitHub runners do not allow Chrome's sandbox
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: test }
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned Qdrant (sha256 verified)
        run: |
          bin="$(scripts/ci-install-qdrant.sh "$QDRANT_VERSION" "$QDRANT_SHA256" "$RUNNER_TEMP/qdrant")"
          echo "OSTLER_QDRANT_BIN=$bin" >> "$GITHUB_ENV"
          echo "OSTLER_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # Each Qdrant-backed test starts its own throwaway server from OSTLER_QDRANT_BIN.
      # QDRANT_URL must NOT be set here: it would take precedence and point every suite at one shared server.
      - name: cargo test --workspace
        run: cargo test --workspace
      # Second Qdrant, with an API key and JWT RBAC, for per-tenant tokens. QDRANT_URL and
      # OSTLER_QDRANT_ADMIN_KEY exist for this step's command only; the key is random and masked.
      # The script fails the step if the suite prints SKIPPED.
      - name: Per-tenant token suite against a JWT-RBAC Qdrant
        run: |
          scripts/ci-qdrant-rbac.sh "$OSTLER_QDRANT_BIN" \
            cargo test -p ostler-memory --test tenant_token_real -- --nocapture
  # The declared minimum Rust version must actually build, with the locked dependencies.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.89" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
  # What `cargo publish` would upload must build on its own (catches files outside crate dirs).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run
  # The install paths (install.sh, npx launcher) against a fake local release. Publishes nothing.
  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: scripts/test-installers.sh
