name: CI
on:
  push: { branches: [main] }
  pull_request:
env:
  CARGO_TERM_COLOR: always
  OSTLER_REQUIRE_CHROME: "1"
  OSTLER_REQUIRE_QDRANT: "1"
  OSTLER_NO_SANDBOX: "1"   # GitHub runners do not allow Chrome's sandbox
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Download Qdrant
        run: |
          mkdir -p "$RUNNER_TEMP/qdrant" && cd "$RUNNER_TEMP/qdrant"
          curl -sSfL -o q.tgz https://github.com/qdrant/qdrant/releases/latest/download/qdrant-x86_64-unknown-linux-gnu.tar.gz
          tar xzf q.tgz
          echo "OSTLER_QDRANT_BIN=$RUNNER_TEMP/qdrant/qdrant" >> "$GITHUB_ENV"
          echo "OSTLER_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # The declared minimum Rust version must actually build, with the locked dependencies.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.89" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
  # What `cargo publish` would upload must build on its own (catches files outside crate dirs).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run
  # The install paths (install.sh, npx launcher) against a fake local release. Publishes nothing.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: scripts/test-installers.sh
