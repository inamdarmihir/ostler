name: Release
# Push a tag like v0.2.0 to build prebuilt binaries and attach them to a GitHub release.
# The binaries are what site/install.sh, `cargo binstall ostler` and the npm wrapper download.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the crate version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        target: aarch64-apple-darwin }
          - { os: macos-13,        target: x86_64-apple-darwin }
          # Built on an older glibc so the binary runs on current LTS distributions.
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release --locked -p ostler
      - name: Smoke test the binary
        run: ./target/release/ostler --version
      - name: Package
        run: scripts/package.sh "${{ matrix.target }}" target/release/ostler dist
      - name: Package the Claude Desktop extension (macOS only; one double-click install)
        if: contains(matrix.target, 'apple-darwin')
        run: scripts/package-mcpb.sh "${{ matrix.target }}" target/release/ostler dist
      - uses: actions/upload-artifact@v7
        with:
          name: ostler-${{ matrix.target }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Combined checksums
        run: cd dist && cat *.sha256 > SHA256SUMS
      - name: Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Ostler ${GITHUB_REF_NAME}" \
            --notes "Easiest (Claude Desktop, macOS): download the \`.mcpb\` for your Mac and double-click it. Terminal: \`curl -fsSL https://inamdarmihir.github.io/ostler/install.sh | sh\` · \`cargo binstall ostler\` · \`npx -y ostler serve\`. See [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
  homebrew:
    # Updates the Homebrew tap (inamdarmihir/homebrew-ostler) after the release exists.
    # Skipped, not failed, until the HOMEBREW_TAP_TOKEN secret is set (fine-grained token with
    # contents:write on the tap repo only).
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip if no tap token
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew update."
      - name: Generate the formula from the published checksums
        if: env.TAP_TOKEN != ''
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir .
          scripts/gen-formula.sh "${GITHUB_REF_NAME}" SHA256SUMS > ostler.rb
          ruby -c ostler.rb
      - name: Push it to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/inamdarmihir/homebrew-ostler.git" tap
          mkdir -p tap/Formula && cp ostler.rb tap/Formula/ostler.rb
          cd tap
          git checkout -B main   # the tap may be empty on the first release
          git config user.name "ostler release bot"; git config user.email "actions@users.noreply.github.com"
          git add Formula/ostler.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "ostler ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
