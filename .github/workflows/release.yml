name: Release
# Push a tag like v0.2.0 to build prebuilt binaries and attach them to a GitHub release.
# The binaries are what site/install.sh, `cargo binstall ostler` and the npm wrapper download.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the crate version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }
          e="$(node -p "require('./editors/vscode/package.json').version")"
          [ "$e" = "$v" ] || { echo "editors/vscode/package.json version $e does not match Cargo.toml version $v"; exit 1; }
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # Built on an older glibc so the binary runs on current LTS distributions.
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release --locked -p ostler
        shell: bash
      - name: Smoke test the binary
        shell: bash
        run: ./target/release/ostler${{ runner.os == 'Windows' && '.exe' || '' }} --version
      - name: Package
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "target/release/ostler${{ runner.os == 'Windows' && '.exe' || '' }}" dist
      - name: Package the Claude Desktop extension (macOS only; one double-click install)
        if: contains(matrix.target, 'apple-darwin')
        run: scripts/package-mcpb.sh "${{ matrix.target }}" target/release/ostler dist
      - name: Build the Python wheel (pip install ostler-mcp; the wheel carries this same binary)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv /tmp/maturin-venv
          /tmp/maturin-venv/bin/pip install maturin
          /tmp/maturin-venv/bin/maturin build --release --locked -o dist
      - name: Build the Python wheel on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv maturin-venv
          maturin-venv/Scripts/pip install maturin
          maturin-venv/Scripts/maturin build --release --locked -o dist
      - name: Smoke test the wheel on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv wheel-venv
          wheel-venv/Scripts/pip install dist/*.whl
          wheel-venv/Scripts/ostler --version
      - name: Smoke test the wheel in a clean environment
        if: runner.os != 'Windows'
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/ostler --version
      - uses: actions/upload-artifact@v7
        with:
          name: ostler-${{ matrix.target }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Combined checksums
        run: cd dist && cat *.sha256 > SHA256SUMS
      - name: Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Ostler ${GITHUB_REF_NAME}" \
            --notes "Easiest (Claude Desktop, macOS): download the \`.mcpb\` for your Mac and double-click it. Terminal: \`curl -fsSL https://inamdarmihir.github.io/ostler/install.sh | sh\` · \`cargo binstall ostler\` · \`npx -y ostler serve\`. See [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
  docker:
    # Multi-arch (amd64 + arm64) image on GHCR, built from the Linux tarballs above: no compile, no QEMU.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Unpack the Linux binaries into the build context
        run: |
          v="${GITHUB_REF_NAME}"
          for pair in "amd64 x86_64" "arm64 aarch64"; do
            set -- $pair
            mkdir -p "docker/bin/$1"
            tar -xzf "dist/ostler-${v}-$2-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/ostler-${v}-$2-unknown-linux-gnu/ostler" "docker/bin/$1/ostler"
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          v="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr A-Z a-z)"
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${v}" \
            -t "$repo:${v}" -t "$repo:latest" --push .

  homebrew:
    # Updates the Homebrew tap (inamdarmihir/homebrew-ostler) after the release exists.
    # Skipped, not failed, until the HOMEBREW_TAP_TOKEN secret is set (fine-grained token with
    # contents:write on the tap repo only).
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip if no tap token
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew update."
      - name: Generate the formula from the published checksums
        if: env.TAP_TOKEN != ''
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir .
          scripts/gen-formula.sh "${GITHUB_REF_NAME}" SHA256SUMS > ostler.rb
          ruby -c ostler.rb
      - name: Push it to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/inamdarmihir/homebrew-ostler.git" tap
          mkdir -p tap/Formula && cp ostler.rb tap/Formula/ostler.rb
          cd tap
          git checkout -B main   # the tap may be empty on the first release
          git config user.name "ostler release bot"; git config user.email "actions@users.noreply.github.com"
          git add Formula/ostler.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "ostler ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
  pypi:
    # Publishes the wheels to PyPI as `ostler-mcp` after the release exists. Two ways, neither needed to release:
    #  * trusted publishing (preferred, no secret): register this repository and workflow file (release.yml) as a
    #    trusted publisher on PyPI, then set the repository variable PYPI_TRUSTED=true;
    #  * an API token in the PYPI_TOKEN secret.
    # With neither, the job skips itself.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets PyPI verify this run for trusted publishing
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      PYPI_TRUSTED: ${{ vars.PYPI_TRUSTED }}
    steps:
      - name: Skip if not configured
        if: env.PYPI_TOKEN == '' && env.PYPI_TRUSTED != 'true'
        run: echo "Neither PYPI_TRUSTED nor PYPI_TOKEN is set; skipping the PyPI upload."
      - uses: actions/download-artifact@v8
        if: env.PYPI_TOKEN != '' || env.PYPI_TRUSTED == 'true'
        with: { path: dist, merge-multiple: true }
      - name: Keep only the wheels
        if: env.PYPI_TOKEN != '' || env.PYPI_TRUSTED == 'true'
        run: find dist -type f ! -name '*.whl' -delete
      - name: Upload with trusted publishing
        if: env.PYPI_TRUSTED == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { skip-existing: true }
      - name: Upload with the API token
        if: env.PYPI_TRUSTED != 'true' && env.PYPI_TOKEN != ''
        env: { TWINE_USERNAME: __token__, TWINE_PASSWORD: "${{ secrets.PYPI_TOKEN }}" }
        run: |
          python3 -m venv /tmp/twine-venv
          /tmp/twine-venv/bin/pip install twine
          /tmp/twine-venv/bin/twine upload --skip-existing dist/*.whl
  vscode:
    # Builds the VS Code extension, attaches it to the release, and publishes it when tokens exist.
    # Marketplace (VSCE_PAT) and Open VSX (OVSX_PAT, for Cursor, Windsurf and forks) are each skipped, not failed, until set.
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run: { working-directory: editors/vscode }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Package
        run: npx vsce package --no-dependencies -o "ostler-vscode-${GITHUB_REF_NAME}.vsix"
      - name: Attach to the release
        run: gh release upload "${GITHUB_REF_NAME}" "ostler-vscode-${GITHUB_REF_NAME}.vsix" --repo "${GITHUB_REPOSITORY}"
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath "ostler-vscode-${GITHUB_REF_NAME}.vsix" -p "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "ostler-vscode-${GITHUB_REF_NAME}.vsix" -p "$OVSX_PAT"
