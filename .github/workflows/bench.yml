name: Benchmarks
# Manual: runs the harness on a Linux runner (PSS-based memory numbers) and uploads raw results.
on: workflow_dispatch
env:
  OSTLER_NO_SANDBOX: "1"
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: cargo build --release -p ostler-bench -p ostler
      - run: |
          mkdir -p out
          ./target/release/ostler-bench --json out/forms.json forms --reps 3
          ./target/release/ostler-bench --json out/footprint.json footprint
          ./target/release/ostler-bench --json out/concurrency.json concurrency --sessions 1,2,4 --lean
          nproc; free -m; google-chrome --version || true
      - uses: actions/upload-artifact@v7
        with: { name: bench-linux, path: out }
