[package]
name = "ostler-a2a"
description = "Agent2Agent (A2A) server for Ostler: lets other agents delegate form tasks to it over HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = "0.1.19"
uuid = { version = "1.20.0", features = ["v4"] }
ostler-browser = { version = "0.2.0", path = "../ostler-browser" }
ostler-mcp = { version = "0.2.0", path = "../ostler-mcp" }

[dev-dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["json"] }
serde_json = "1.0.154"
ostler-cdp = { path = "../ostler-cdp" }
ostler-fixtures = { path = "../ostler-fixtures" }
