[package]
name = "waymarker-cli"
description = "Headless browser for AI coding agents: MCP server with Qdrant-backed memory and reliable form filling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["mcp", "browser", "qdrant", "ai-agents", "automation"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "waymarker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive", "env"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time"] }
toml = "1.0.7"
waymarker-a2a = { version = "0.2.0", path = "../waymarker-a2a" }
waymarker-browser = { version = "0.2.0", path = "../waymarker-browser" }
waymarker-cdp = { version = "0.2.0", path = "../waymarker-cdp" }
waymarker-fixtures = { version = "0.2.0", path = "../waymarker-fixtures" }
waymarker-mcp = { version = "0.2.0", path = "../waymarker-mcp" }
waymarker-memory = { version = "0.2.0", path = "../waymarker-memory" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["process", "io-util", "macros", "rt-multi-thread", "time"] }
waymarker-cdp = { path = "../waymarker-cdp" }
