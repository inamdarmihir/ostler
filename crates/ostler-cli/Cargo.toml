[package]
name = "ostler"
description = "Open-source MCP browser for AI coding agents: research that cites only pages it read, verified form filling, Qdrant memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
rust-version.workspace = true
keywords = ["mcp", "browser", "ai-agents", "research", "qdrant"]
categories = ["command-line-utilities", "web-programming"]

# `cargo binstall ostler` downloads the prebuilt binary from the GitHub release instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ostler-v{ version }-{ target }.tar.gz"
bin-dir = "ostler-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "ostler"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive", "env"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time"] }
toml = "1.0.7"
ostler-a2a = { version = "0.2.0", path = "../ostler-a2a" }
ostler-browser = { version = "0.2.0", path = "../ostler-browser" }
ostler-cdp = { version = "0.2.0", path = "../ostler-cdp" }
ostler-fixtures = { version = "0.2.0", path = "../ostler-fixtures" }
ostler-mcp = { version = "0.2.0", path = "../ostler-mcp" }
ostler-memory = { version = "0.2.0", path = "../ostler-memory" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["process", "io-util", "macros", "rt-multi-thread", "time"] }
ostler-cdp = { path = "../ostler-cdp" }
