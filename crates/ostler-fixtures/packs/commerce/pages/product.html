<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearthside Goods: product</title><style>body{font:15px system-ui;max-width:640px;margin:1.5rem auto;padding:0 1rem}nav a{margin-right:1rem}label{display:block;margin:.6rem 0 .2rem}input,select{padding:.4rem;width:100%;box-sizing:border-box}input[type=radio],input[type=checkbox]{width:auto}button{margin-top:1rem;padding:.5rem 1rem}#list{position:relative}#list li{position:absolute;left:0;right:0;height:52px;list-style:none;border-bottom:1px solid #ddd;box-sizing:border-box;padding:.3rem 0}.price{float:right;font-weight:600}.muted{color:#666;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}[hidden]{display:none!important}iframe{width:100%;height:260px;border:1px solid #888}</style>
<nav><a href="/packs/commerce/shop.html">Catalogue</a><a href="/packs/commerce/cart.html">Cart</a></nav>
<main id="p"></main>
<script src="/packs/commerce/catalog.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id'),p=CATALOG.find(x=>x.id===id),m=document.getElementById('p');
if(!p){m.innerHTML='<h1>Product not found</h1>'}else{
 const base=p.detailPrice||p.price,sizes=p.sizes||[['Standard','STD',0],['Large','LRG',400]],sku=p.sku||p.id.toUpperCase();
 m.innerHTML='<h1>'+p.name+'</h1><p class="muted">'+p.cat+'</p><p>Price: <strong id="price"></strong></p>'+
 '<label for="size">Size</label><select id="size" name="size">'+sizes.map(s=>'<option value="'+s[1]+'" data-add="'+s[2]+'">'+s[0]+'</option>').join('')+'</select>'+
 '<fieldset><legend>Colour</legend><label><input type="radio" name="color" value="GRN" checked> Green</label><label><input type="radio" name="color" value="GRY"> Grey</label></fieldset>'+
 '<label for="qty">Quantity</label><input id="qty" name="qty" type="number" min="1" value="1">'+
 '<button id="add" type="button"'+(p.stock?'':' disabled')+'>Add to cart</button><div id="msg" role="status"></div>';
 const size=document.getElementById('size'),priceEl=document.getElementById('price');
 const unit=()=>base+(+size.selectedOptions[0].dataset.add);
 const upd=()=>{priceEl.textContent=fmt(unit())};size.addEventListener('change',upd);upd();
 document.getElementById('add').onclick=async()=>{
  const color=document.querySelector('[name=color]:checked').value,qty=Math.max(1,+document.getElementById('qty').value||1),s=sku+'-'+size.value+'-'+color;
  const line={sku:s,name:p.name,qty,unit:unit()};
  try{await fetch('/packs/commerce/api/cart',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sku:s,qty,unit_price:fmt(unit())})})}catch(e){}
  const c=cartGet();c.push(line);cartSet(c);
  document.getElementById('msg').innerHTML='Added '+qty+' x '+p.name+' ('+s+') to your cart. <a href="/packs/commerce/cart.html">View cart</a>'}}
</script>
