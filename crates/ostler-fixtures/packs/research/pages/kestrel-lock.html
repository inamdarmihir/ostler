<h1>The Kestrel Lock</h1>
<p>The Kestrel Lock is a double-chamber canal lock on the Kestrel River. It opened in 1887 and was designed by <a href="/packs/research/marta-ilves.html">Marta Ilves</a>.</p>
<p>A major restoration in 1962 was supervised by the engineer Tomas Reyes, who is sometimes wrongly credited with the original design.</p>
<p>See also: <a href="/packs/research/index.html">Archive index</a>.</p>
