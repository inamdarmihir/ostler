<h1>Marta Ilves (1851-1919)</h1>
<p>Marta Ilves was a civil engineer. She was born in <a href="/packs/research/oldfeld.html">Oldfeld</a> and trained at the Northern Polytechnic.</p>
<p>She worked for a decade in <a href="/packs/research/brindlemoor.html">Brindlemoor</a> before returning to the Kestrel Valley to design the Kestrel Lock.</p>
