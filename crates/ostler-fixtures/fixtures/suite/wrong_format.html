<!doctype html><meta charset=utf-8><title>Register a vehicle</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Register a vehicle</h1>
<form id="f" novalidate>
 <label for="pl">Plate number (format AB-1234)</label><input id="pl" name="plate" required>
 <div class="error" id="e1" role="alert" hidden></div>
 <label for="ow">Owner</label><input id="ow" name="owner" required>
 <button type="submit">Register</button>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const o=fdo(e.target);const er=document.getElementById('e1');er.hidden=true;
 if(!/^[A-Z]{2}-\d{4}$/.test(o.plate)){er.textContent='Plate number must look like AB-1234.';er.hidden=false;return}
 await send(o);document.body.innerHTML='<h1>Registered</h1>'});</script>
