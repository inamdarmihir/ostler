<!doctype html><meta charset=utf-8><title>Preferences</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Email preferences</h1>
<form id="f">
 <label for="e">Email</label><input id="e" name="email" type="email" required>
 <fieldset><legend>Keep me posted</legend>
  <label><input type="checkbox" name="opt_news" value="yes"> Send me the weekly newsletter</label>
  <label><input type="checkbox" name="opt_product" value="yes"> Tell me about product updates</label>
  <label><input type="checkbox" name="opt_partner" value="yes"> Share my details with partners for their offers</label>
  <label><input type="checkbox" name="opt_sms" value="yes"> Text me (SMS) offers</label></fieldset>
 <label><input type="checkbox" name="privacy" value="yes" required> I have read the privacy policy *</label>
 <button type="submit">Save preferences</button>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const o=fdo(e.target);
 for(const k of ['opt_news','opt_product','opt_partner','opt_sms','privacy'])o[k]=o[k]||'no';await send(o);document.body.innerHTML='<h1>Saved</h1>'});</script>
