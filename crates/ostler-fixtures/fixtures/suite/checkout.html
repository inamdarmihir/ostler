<!doctype html><meta charset=utf-8><title>Checkout</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Checkout</h1>
<form id="f" novalidate>
<p id="progress">Step 1 of 3</p>
<div class="step" data-step="1"><h2>Shipping address</h2>
 <label for="sn">Full name</label><input id="sn" name="ship_name" required autocomplete="shipping name">
 <label for="sa">Street address</label><input id="sa" name="ship_addr" required autocomplete="shipping street-address">
 <label for="sc">City</label><input id="sc" name="ship_city" required autocomplete="shipping address-level2">
 <label for="sz">ZIP code</label><input id="sz" name="ship_zip" required inputmode="numeric" autocomplete="shipping postal-code">
 <label for="sk">Country</label><select id="sk" name="ship_country" required autocomplete="shipping country"><option value="">Select a country</option><option value="us">United States</option><option value="ca">Canada</option></select>
 <div class="error" id="e1" role="alert" hidden></div>
 <button type="button" class="next">Continue to billing</button></div>
<div class="step" data-step="2" hidden><h2>Billing address</h2>
 <label><input type="checkbox" id="same" name="bill_same" value="yes" checked> Billing address is the same as shipping</label>
 <div id="bill" hidden>
  <label for="bn">Billing name</label><input id="bn" name="bill_name" autocomplete="billing name">
  <label for="ba">Billing street address</label><input id="ba" name="bill_addr" autocomplete="billing street-address">
  <label for="bc">Billing city</label><input id="bc" name="bill_city" autocomplete="billing address-level2">
  <label for="bz">Billing ZIP code</label><input id="bz" name="bill_zip" autocomplete="billing postal-code">
 </div>
 <div class="error" id="e2" role="alert" hidden></div>
 <button type="button" class="back">Back</button> <button type="button" class="next">Continue to review</button></div>
<div class="step" data-step="3" hidden><h2>Review</h2><p id="sum"></p>
 <label for="note">Delivery instructions</label><textarea id="note" name="note"></textarea>
 <label><input type="checkbox" name="confirm" id="confirm" value="yes"> I confirm the order details *</label>
 <div class="error" id="e3" role="alert" hidden></div>
 <button type="button" class="back">Back</button> <button type="submit">Place order</button></div>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
let cur=1;const steps=[...document.querySelectorAll('.step')],$=id=>document.getElementById(id);
const show=n=>{cur=n;steps.forEach(s=>s.hidden=(+s.dataset.step!==n));$('progress').textContent='Step '+n+' of 3'};
$('same').addEventListener('change',()=>{$('bill').hidden=$('same').checked});
function ok(n){const s=steps[n-1],e=$('e'+n);e.hidden=true;
 for(const i of s.querySelectorAll('[required]')) if(!i.value.trim()){e.textContent='Please fill in all required fields.';e.hidden=false;return false}
 if(n===1&&!/^\d{5}$/.test($('sz').value)){e.textContent='Enter a 5-digit ZIP code.';e.hidden=false;return false}
 if(n===2&&!$('same').checked)for(const i of ['bn','ba','bc','bz'])if(!$(i).value.trim()){e.textContent='Enter the billing address.';e.hidden=false;return false}
 if(n===3&&!$('confirm').checked){e.textContent='Please confirm your order.';e.hidden=false;return false}return true}
document.querySelectorAll('.next').forEach(b=>b.onclick=()=>ok(cur)&&show(cur+1));
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>show(cur-1));
$('f').addEventListener('submit',async e=>{e.preventDefault();if(!ok(3))return;const o=fdo(e.target);
 if(!$('same').checked){}else{o.bill_name=o.ship_name;o.bill_addr=o.ship_addr;o.bill_city=o.ship_city;o.bill_zip=o.ship_zip}
 o.bill_same=$('same').checked?'yes':'no';await send(o);document.body.innerHTML='<h1>Order placed</h1><p>Thank you.</p>'});
</script>
