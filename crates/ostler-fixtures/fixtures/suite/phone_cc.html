<!doctype html><meta charset=utf-8><title>Verify your phone</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Verify your phone</h1>
<form id="f">
 <label for="cc">Country code</label>
 <select id="cc" name="country_code"><option value="+1">United States (+1)</option><option value="+44">United Kingdom (+44)</option><option value="+49">Germany (+49)</option><option value="+91">India (+91)</option><option value="+81">Japan (+81)</option></select>
 <label for="p">Phone number</label><input id="p" name="national" type="tel" inputmode="tel" autocomplete="off">
 <button type="submit">Send code</button>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
const p=document.getElementById('p');
p.addEventListener('input',()=>{const d=p.value.replace(/\D/g,'').slice(0,10);p.value=d.length>5?d.slice(0,5)+' '+d.slice(5):d});
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const o=fdo(e.target);o.national=o.national.replace(/ /g,'');await send(o);document.body.innerHTML='<h1>Code sent</h1>'});</script>
