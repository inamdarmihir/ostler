<!doctype html><meta charset=utf-8><title>Terms of service</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Terms of service</h1>
<form id="f">
 <div id="tos" style="height:80px;overflow:auto;border:1px solid #888;padding:.5rem"><p>1. Acceptance.</p><p style="margin-top:200px">2. Use of the service.</p><p style="margin-top:200px">3. Liability.</p><p style="margin-top:200px">End of terms.</p></div>
 <label><input type="checkbox" id="acc" name="accept" value="yes" disabled> I have read and accept the terms</label>
 <label for="nm">Full name</label><input id="nm" name="name">
 <button type="submit">Accept and continue</button>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
const t=document.getElementById('tos');t.addEventListener('scroll',()=>{if(t.scrollTop+t.clientHeight>=t.scrollHeight-4)document.getElementById('acc').disabled=false});
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();await send(fdo(e.target));document.body.innerHTML='<h1>Accepted</h1>'});</script>
