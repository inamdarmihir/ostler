<!doctype html><meta charset=utf-8><title>Update bank details</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Update bank details</h1>
<form id="f">
 <label for="h">Account holder</label><input id="h" name="holder" required>
 <label for="a">Account number</label><input id="a" name="account" value="XXXX-4821" disabled>
 <label for="r">Routing number</label><input id="r" name="routing" readonly value="021000021">
 <label for="n">Nickname</label><input id="n" name="nickname">
 <button type="submit">Save</button>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();await send(fdo(e.target));document.body.innerHTML='<h1>Saved</h1>'});</script>
