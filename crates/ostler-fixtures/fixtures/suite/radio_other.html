<!doctype html><meta charset=utf-8><title>Quick survey</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Quick survey</h1>
<form id="f">
 <fieldset><legend>How did you hear about us?</legend>
  <label><input type="radio" name="source" value="search"> Search engine</label>
  <label><input type="radio" name="source" value="friend"> A friend</label>
  <label><input type="radio" name="source" value="social"> Social media</label>
  <label><input type="radio" name="source" value="other"> Other</label>
  <input id="oth" name="source_other" placeholder="Please specify" aria-label="Other (please specify)" hidden></fieldset>
 <label for="n">Anything else?</label><textarea id="n" name="comment"></textarea>
 <button type="submit">Send</button>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
document.querySelectorAll('input[name=source]').forEach(r=>r.addEventListener('change',()=>{document.getElementById('oth').hidden=document.querySelector('input[name=source]:checked').value!=='other'}));
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();await send(fdo(e.target));document.body.innerHTML='<h1>Thanks</h1>'});</script>
