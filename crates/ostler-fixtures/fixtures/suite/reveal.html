<!doctype html><meta charset=utf-8><title>Tell us about your income</title><style>body{font:15px system-ui;max-width:540px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input[type=radio],label input[type=checkbox]{width:auto}[hidden]{display:none!important}</style>
<h1>Tell us about your income</h1>
<form id="f">
 <label for="es">Employment status</label><select id="es" name="status"><option value="">Select...</option><option value="employed">Employed</option><option value="self">Self-employed</option><option value="retired">Retired</option></select>
 <div id="emp" hidden><label for="er">Employer name</label><input id="er" name="employer"></div>
 <div id="biz" hidden><label for="bn">Business name</label><input id="bn" name="business"><label for="tid">Tax ID (EIN)</label><input id="tid" name="ein" placeholder="12-3456789"></div>
 <label for="inc">Annual income (USD)</label><input id="inc" name="income" inputmode="numeric">
 <button type="submit">Continue</button>
</form>
<script>const send=o=>fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const fdo=f=>{const o={};for(const [k,v] of new FormData(f).entries()){const x=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],x):x}return o};
const $=id=>document.getElementById(id);
$('es').addEventListener('change',()=>{setTimeout(()=>{$('emp').hidden=$('es').value!=='employed';$('biz').hidden=$('es').value!=='self'},120)});
$('inc').addEventListener('input',()=>{const d=$('inc').value.replace(/\D/g,'');$('inc').value=d?'$'+Number(d).toLocaleString('en-US'):''});
$('f').addEventListener('submit',async e=>{e.preventDefault();const o=fdo(e.target);o.income=(o.income||'').replace(/\D/g,'');await send(o);document.body.innerHTML='<h1>Saved</h1>'});</script>
