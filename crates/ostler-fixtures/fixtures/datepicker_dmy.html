<!doctype html><meta charset=utf-8><title>Stay</title>
<form id="f" onsubmit="return false">
  <label for="d">Arrival</label>
  <input id="d" name="arrival" readonly placeholder="dd/mm/yyyy" aria-haspopup="dialog">
  <div id="cal" role="dialog" aria-label="Choose date" hidden><strong id="title">March 2026</strong><div id="grid" role="grid"></div></div>
  <button type="submit" id="go">Go</button>
</form>
<script>
const $=id=>document.getElementById(id);
const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
function draw(){const g=$('grid');g.innerHTML='';
 for(let i=1;i<=31;i++){const b=document.createElement('button');b.type='button';b.textContent=i;b.setAttribute('role','gridcell');
  b.setAttribute('aria-label','March '+i+', 2026');
  b.onclick=()=>{$('d').value='2026-03-'+String(i).padStart(2,'0');$('cal').hidden=true};g.appendChild(b)}}
$('d').addEventListener('click',()=>{$('cal').hidden=false;draw()});
</script>
