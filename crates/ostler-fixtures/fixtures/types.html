<!doctype html><meta charset=utf-8><title>Event registration</title><style>body{font:15px system-ui;max-width:520px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input,select,textarea{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}.error{color:#b00020;font-size:13px}fieldset{margin:1rem 0}fieldset label{display:inline-block;margin-right:1rem}fieldset input{width:auto}</style>
<h1>Register for the event</h1>
<form id="f">
  <label for="dob">Date of birth</label><input id="dob" name="dob" type="date" required>
  <label for="t">Preferred time</label><input id="t" name="time" type="time">
  <label for="g">Guests</label><input id="g" name="guests" type="number" min="1" max="10">
  <label for="sat">Satisfaction (0-10)</label><input id="sat" name="sat" type="range" min="0" max="10">
  <fieldset><legend>Plan</legend>
    <label><input type="radio" name="plan" value="free"> Free</label>
    <label><input type="radio" name="plan" value="pro"> Pro</label>
    <label><input type="radio" name="plan" value="team"> Team</label>
  </fieldset>
  <fieldset><legend>Interests</legend>
    <label><input type="checkbox" name="interests" value="ai"> AI</label>
    <label><input type="checkbox" name="interests" value="web"> Web</label>
    <label><input type="checkbox" name="interests" value="data"> Data</label>
  </fieldset>
  <label for="diet">Dietary needs</label>
  <select id="diet" name="diet" multiple size="3"><option value="veg">Vegetarian</option><option value="vegan">Vegan</option><option value="gf">Gluten free</option></select>
  <label for="cv">CV (optional)</label><input id="cv" name="cv" type="file">
  <label for="notes">Notes</label><textarea id="notes" name="notes"></textarea>
  <label><input type="checkbox" name="tos" value="1" style="width:auto"> I accept the terms *</label>
  <button type="submit">Register</button>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
 const fd=new FormData(e.target),o={};
 for(const [k,v] of fd.entries()){const val=v instanceof File?v.name:v;o[k]=(k in o)?[].concat(o[k],val):val}
 o.interests=[].concat(o.interests||[]);o.diet=[].concat(o.diet||[]);
 await fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});
 document.body.innerHTML='<h1>Registered</h1>'});
</script>
