<!doctype html><meta charset=utf-8><title>Quick contact</title><style>body{font:15px system-ui;max-width:480px;margin:2rem auto}label{display:block;margin:.7rem 0 .2rem}input{padding:.4rem;width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.5rem 1rem}</style>
<h1>Quick contact</h1>
<form id="f">
  <label for="n">Your name</label><input id="n" name="name" required>
  <label for="e">Your email</label><input id="e" name="email" type="email" required>
  <button type="submit">Send</button>
</form>
<div id="status" role="status"></div>
<script>
  // The form stays on screen; the page says so only after the server accepted the data.
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(ev.target));
    const r = await fetch('/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (r.ok && !location.search.includes('quiet')) document.getElementById('status').textContent = 'Thanks! Your message has been sent.';
  });
</script>
