[package]
name = "ostler-mcp"
description = "MCP (Model Context Protocol) server layer for Ostler (internal crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
rhai = { version = "1.27.0", features = ["serde"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "sync", "signal"] }
tracing = "0.1.44"
url = "2.5.8"
ostler-browser = { version = "0.2.0", path = "../ostler-browser" }
ostler-extract = { version = "0.2.0", path = "../ostler-extract" }
ostler-forms = { version = "0.2.0", path = "../ostler-forms" }
ostler-memory = { version = "0.2.0", path = "../ostler-memory" }
ostler-research = { version = "0.2.0", path = "../ostler-research" }
