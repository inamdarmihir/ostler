[package]
name = "waymarker-memory"
description = "Waymarker: memory component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "process", "net", "fs"] }
uuid = { version = "1.20.0", features = ["v5", "v4"] }

[dev-dependencies]
reqwest = { version = "0.13.3", default-features = false }
tempfile = "3.27.0"
wiremock = "0.6.5"
