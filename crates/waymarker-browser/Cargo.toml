[package]
name = "waymarker-browser"
description = "Waymarker: browser component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
waymarker-fixtures = { path = "../waymarker-fixtures" }

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
url = "2.5.8"
waymarker-cdp = { version = "0.1.0", path = "../waymarker-cdp" }
waymarker-forms = { version = "0.1.0", path = "../waymarker-forms" }
