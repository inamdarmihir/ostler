[package]
name = "waymarker-mcp"
description = "Waymarker: mcp component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "sync"] }
tracing = "0.1.44"
url = "2.5.8"
waymarker-browser = { version = "0.1.0", path = "../waymarker-browser" }
waymarker-forms = { version = "0.1.0", path = "../waymarker-forms" }
waymarker-memory = { version = "0.1.0", path = "../waymarker-memory" }
