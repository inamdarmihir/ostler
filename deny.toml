# cargo-deny policy. Run locally with: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add an entry here only with a reason and a removal condition, e.g.
# { id = "RUSTSEC-0000-0000", reason = "not reachable: ..." }
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# M0 adoption spikes (docs/adr/0012 to 0018) checked the dependency trees of Qdrant Edge, qdrant-client,
# rmcp and htmd against this list: all fit. One miss was found, NOT added here:
#   MPL-2.0  option-ext 0.2.0, pulled in by fastembed -> hf-hub -> dirs -> dirs-sys (docs/adr/0013).
#   It would need an exception, with a reason and a removal condition, if fastembed's default `hf-hub`
#   feature is adopted; the alternative is to drop `hf-hub` and download models ourselves.
# Not allowed and rejected on licence grounds: html2md (GPL-3.0+), see docs/adr/0016.

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies carry no version requirement

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
